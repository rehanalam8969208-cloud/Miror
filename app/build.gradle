plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mirrornote.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mirrornote.app'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
